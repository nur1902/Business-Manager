name: buisness_manager
description: "Business Manager - sales, invoices, inventory and reports for small businesses (daxel.shop)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2

  # Firebase
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.0
  google_sign_in: ^7.2.0

  # State management + navigation
  provider: ^6.1.5
  go_router: ^16.2.0

  # Simple key/value storage (theme + language)
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true   # enables Flutter localization (l10n.yaml)
